[colors]
; Format: #AARRGGBB (AA = Alpha/Transparency)
; 'cc' = ~80% opacity for transparency effect
background = #cc2B2B2B
background-alt = #cc383838
foreground = #F5F0E6
primary = #D4C5A3
secondary = #A89F91
alert = #E67E80
disabled = #6B6B6B

[bar/main]
; Monitor is set via environment variable at launch (e.g., MONITOR=HDMI-0)
monitor = ${env:MONITOR:}

width = 98%
height = 25
offset-x = 1%
offset-y = 10
radius = 12
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 3
border-size = 0
padding-left = 1
padding-right = 1
module-margin = 1

font-0 = "JetBrainsMono Nerd Font:size=11;2"

modules-left = bspwm
modules-center = date
modules-right = pulseaudio memory wlan battery

cursor-click = pointer
enable-ipc = true

[module/bspwm]
type = internal/bspwm
label-focused = %index%
label-focused-background = ${colors.primary}
label-focused-foreground = ${colors.background}
label-focused-padding = 2
label-occupied = %index%
label-occupied-padding = 2
label-empty = %index%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 2

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S
label = %date%
label-foreground = ${colors.foreground}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = "VOL %percentage%%"
label-muted = "MUTED"
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 2
label = "RAM %percentage_used%%"
label-foreground = ${colors.foreground}

[module/wlan]
type = internal/network
interface-type = wireless
interval = 3
label-connected = "WIFI %essid%"
label-disconnected = "NO WIFI"
label-foreground = ${colors.foreground}

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
label-charging = "BAT %percentage%% CHG"
label-discharging = "BAT %percentage%%"
label-full = "BAT FULL"
label-foreground = ${colors.foreground}   
